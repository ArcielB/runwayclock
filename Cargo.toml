[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/runway-core",
    "crates/runway-db",
    "crates/runway-import",
    "crates/runway-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
