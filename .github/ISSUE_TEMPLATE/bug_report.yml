name: Bug report
description: Report a reproducible RunwayClock problem without sharing financial data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach a real bank statement, database, widget snapshot, account identifier, or screenshot containing financial information. Reproduce import problems with a minimal synthetic CSV.
  - type: input
    id: version
    attributes:
      label: RunwayClock version
      description: Run `cat ~/.local/share/runwayclock/product/VERSION` for installer-based builds.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux environment
      description: Distribution, version, desktop environment, display server, and CPU architecture.
      placeholder: Pop!_OS 22.04, GNOME 42, X11, x86_64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic amounts, merchants, dates, and account identifiers only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Financial-data check
      options:
        - label: I removed or replaced all personal and financial information.
          required: true
