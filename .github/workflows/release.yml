name: Linux release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf rpm shellcheck
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Validate release version and license
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
      - name: Verify installers and widgets
        run: |
          shellcheck install.sh uninstall.sh scripts/*.sh widgets/gnome/install.sh
          ./scripts/test-installers.sh
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend checks
        working-directory: app
        run: npm run check
      - name: Build Linux packages
        working-directory: app
        run: npm run tauri -- build --bundles deb,rpm,appimage --ci
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles-${{ matrix.arch }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Download verified architecture bundles
        uses: actions/download-artifact@v8
        with:
          pattern: linux-bundles-*
          path: ${{ runner.temp }}/runwayclock-bundles
          merge-multiple: true
      - name: Package checksums, installer, and GNOME widget
        env:
          RUNWAYCLOCK_BUNDLE_ROOT: ${{ runner.temp }}/runwayclock-bundles
        run: ./scripts/package-release-assets.sh "$RUNNER_TEMP/runwayclock-release"
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/runwayclock-release"/* \
            --verify-tag \
            --title "RunwayClock $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
